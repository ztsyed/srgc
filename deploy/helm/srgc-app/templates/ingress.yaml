apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "srgc.fullname" . }}
  labels: {{- include "srgc.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.clusterIssuer | quote }}
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    # Newsletter upload runs the LLM parses inline and can take minutes; keep
    # the proxy connection open long enough for the slow action (a 120s read
    # timeout was 504-ing the browser mid-parse). On Ollama the events and duty
    # parses queue behind each other on the DGX (~4–5 min total), hence 600.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: {{ .Values.ingressClassName | quote }}
  rules:
    - host: {{ .Values.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "srgc.fullname" . }}
                port:
                  number: 3000
  tls:
    - hosts:
        - {{ .Values.host | quote }}
      secretName: {{ .Values.tlsSecretName | quote }}
